
{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block topbar_title %}
<h5 class="dashboard-title">Dashboard</h5>
{% endblock %}

{% block content %}

    <!-- Heading -->
<div class="page-header">

    <div>
        <h5>
            Welcome Back Admin 👋
        </h5>

    </div>


</div>
    <!-- Cards -->
     <div class="cards">

    <div class="card blue">

        <div class="card-content">

            <h2 id="totalEmployees">0</h2>

            <p>Total Employees</p>

        </div>
        <div class="card-icon">
        <i class="fas fa-users"></i>
        </div>

    </div>

    <div class="card green">

        <div class="card-content">

            <h2 id="activeEmployees">0</h2>

            <p>Active Employees</p>

        </div>
         <div class="card-icon">
        <i class="fas fa-user-check"></i>
         </div>

    </div>

    <div class="card orange">

        <div class="card-content">

             <h2 id="joinedThisMonth">0</h2>

        <p>Joined This Month</p>


        </div>

         <div class="card-icon">
             <i class="fas fa-user-plus"></i>
        </div>

    </div>

    <div class="card red">

        <div class="card-content">

            <h2 id="departmentCount">0</h2>

            <p>Departments</p>

        </div>
        <div class="card-icon">
            <i class="fas fa-building"></i>
        </div>

    </div>

</div>

    <!-- Charts -->
    <div class="charts">

    <!-- Employee Growth -->

    <div class="chart-box">

    <div class="chart-header">
    <h3><i class="fas fa-chart-line"></i> Employee Growth</h3>

    <select id="periodSelect">
        <option value="month">Month</option>
        <option value="year">Year</option>
    </select>
</div>

    <div class="chart-container">
        <canvas id="employeeChart"></canvas>
    </div>

</div>

    <!-- Department Chart -->

    <div class="chart-box">

    <div class="chart-header">
        <h3>Employees by Department</h3>
    </div>

    <div class="chart-container">
        <canvas id="departmentChart"></canvas>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

{% endblock %}
