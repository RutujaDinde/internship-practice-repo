{% extends "base.html" %}


{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_employee.css') }}">
{% endblock %}

{% block content %}


<div class="employee-container">


    <div class="employee-header">

        <div>
            <h2>Add Employee</h2>
            <p>Create a new employee profile</p>
        </div>

    </div>

    <form id="employeeForm" enctype="multipart/form-data">

        <!-- BASIC INFORMATION -->

        <div class="form-card">

            <h4> <i class="fa-solid fa-user"></i>
                Basic Information
            </h4>


            <div class="form-row">
                <div class="form-group">

                    <label>Employee Name</label>

                    <input type="text" id="Emp_Name" placeholder="Enter employee name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="Email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="Password" placeholder="Enter password">
                </div>
            </div>

        </div>



 <!-- EMPLOYMENT DETAILS -->
        <div class="form-card">
            <h4><i class="fa-solid fa-briefcase"></i>
                Employment Details
            </h4>
            <div class="form-row">
                <div class="form-group">

                  <label>Department</label>

                    <select id="Dept_ID">
                        <option value="">
                            Select Department
                        </option>

                        {% for dept in departments %}

                        <option value="{{dept.Dept_ID}}">
                            {{dept.Dept_Name}}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="form-group">

                    <label>Designation</label>

                    <input type="text" id="Designation" placeholder="Enter designation">

                </div>

                <div class="form-group">

                    <label>Salary</label>

                    <input type="number" id="Salary" placeholder="Enter salary">

                </div>

                <div class="form-group">

                    <label>Joining Date</label>

                    <input type="date"id="Hire_Date">

                </div>

            </div>

        </div>

        <!-- ACCOUNT DETAILS -->


        <div class="form-card">

            <h4>

                <i class="fa-solid fa-user-shield"></i>

                Account Details

            </h4>

            <div class="form-row">

                 <div class="form-group">

                    <label>Role</label>

                    <input type="text"  value="Employee"  class="form-control"  readonly>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <input type="text"id="Employment_Status"value="Active"readonly>

                </div>

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="form-buttons">
            
            <button type="button" class="cancel-btn">

                Cancel

            </button>

            <button type="submit"  class="save-btn">
                <i class="fa-solid fa-user-plus"></i>

                Save Employee

            </button>

        </div>

    </form>

</div>

{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/employee.js') }}"></script>

{% endblock %}
