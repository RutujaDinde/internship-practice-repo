<!DOCTYPE html>
<html>

<head>

<title>
{% block title %}
Employee EMS
{% endblock %}
</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/css/employee_dashboard.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<i class="fa fa-users"></i>

<div>
    <h4>EMS</h4>
   <span>Employee<br>Management System</span>
</div>
</div>

<a href="/employee-dashboard">

<i class="fa fa-home"></i>
Dashboard

</a>

<a href="/employee-profile">

<i class="fa fa-user"></i>
My Profile
</a>


<a href="/employee-change-password">

<i class="fa fa-lock"></i>
Change Password
</a>


<a href="javascript:void(0);" class="nav-link" onclick="logout()">

    <i class="fa fa-sign-out"></i>

    <span>Logout</span>

</a>

</div>

<!-- MAIN -->

<div class="main">

<nav class="topbar">

<i class="fa fa-bars"></i>

<div class="user">

<img src="/static/uploads/default.png">

<div>

<b id="topName">Employee</b>

<br>

<small>Employee</small>

</div>

<i class="fa fa-angle-down"></i>

</div>

</nav>

<div class="content">

{% block content %}

{% endblock %}

</div>

</div>

</div>

<script src="/static/js/auth.js"></script>
<script src="/static/js/topbar.js"></script>

</body>
</html>
