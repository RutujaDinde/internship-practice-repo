<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Administrator Account</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="icon">
<i class="fa-solid fa-user-shield"></i>
</div>

<h2>Create Administrator Account</h2>

<p>Setup your system administrator</p>

<form id="SignupForm" enctype="multipart/form-data">


<div class="form-grid">

<!-- Name -->

<div class="input-box">

<label>Full Name</label>

<div class="input-field">

<i class="fa-solid fa-user"></i>

<input type="text" id="Emp_Name" placeholder="Enter Full Name" required>

</div>

</div>

<!-- Email -->

<div class="input-box">

<label>Email</label>

<div class="input-field">

<i class="fa-solid fa-envelope"></i>

<input type="email" id="Email" placeholder="Enter Email" required>

</div>

</div>


<!-- Password -->

<div class="input-box">

<label>Password</label>

<div class="input-field">

<i class="fa-solid fa-lock"></i>

<input type="password" id="Password" placeholder="Enter Password"required>

</div>

</div>

<!-- Phone -->

<div class="input-box">

<label>Phone Number</label>

<div class="input-field">

<i class="fa-solid fa-phone"></i>

<input type="text" id="Phone_No" placeholder="Enter Phone Number" required>

</div>

</div>

<!-- Address -->

<div class="input-box">

<label>Address</label>

<div class="input-field">

<i class="fa-solid fa-location-dot"></i>

<input type="text" id="Address" placeholder="Enter Address" required>

</div>

</div>

<!-- City -->

<div class="input-box">

<label>City</label>

<div class="input-field">

<i class="fa-solid fa-city"></i>

<input  type="text"id="City" placeholder="Enter City"required>

</div>

</div>

<!-- Profile Image -->

<div class="input-box">

<label>Profile Image (Optional)</label>

<div class="input-field">

<i class="fa-solid fa-image"></i>

<input type="file" id="Profile_Image"accept="image/*">

</div>

</div>

</div>

<button type="submit">

<i class="fa-solid fa-user-shield"></i>

Create Admin Account

</button>

<p id="message"></p>

<div class="bottom-text">

Already have an account?

<a href="/login-page">Login</a>

</div>

</form>

</div>

</div>

<script src="{{ url_for('static', filename='js/signup.js') }}"></script>

</body>

</html>
