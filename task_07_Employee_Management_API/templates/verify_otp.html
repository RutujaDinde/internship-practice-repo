<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Verify OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(rgba(6,25,60,.65),
            rgba(6,25,60,.65)),
            url("{{ url_for('static', filename='uploads/auth-bg.png') }}");

            background-size:cover;

            background-position:center;

            font-family:'Poppins',sans-serif;

        }

        .otp-card{

            width:430px;

            background:rgba(255,255,255,.97);

            padding:40px;

            border-radius:18px;

            box-shadow:0 20px 50px rgba(0,0,0,.25);

        }

        .icon{

            width:80px;

            height:80px;

            border-radius:50%;

            background:#0d6efd;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:32px;

            margin:auto;

            margin-bottom:20px;

        }

        h3{

            text-align:center;

            font-weight:700;

            color:#1b2b52;

        }

        p{

            text-align:center;

            color:#6c757d;

            margin-bottom:30px;

        }

        .form-control{

            height:50px;

            border-radius:10px;

        }

        #OTP{

            text-align:center;

            font-size:22px;

            letter-spacing:8px;

            font-weight:bold;

        }

        .btn-primary{

            height:48px;

            border-radius:10px;

            font-weight:600;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="otp-card">

    <div class="icon">

        <i class="fa-solid fa-shield-halved"></i>

    </div>

    <h3> Verify OTP</h3>

    <p> Enter your registered email and the 6-digit OTP sent to your email.</p>

    <form id="verifyOTPForm">

        <div class="mb-3">

            <label class="form-label"> Email Address</label>

            <input type="email" id="Email" class="form-control" placeholder="Enter your registered email" required>

        </div>

        <div class="mb-3">

            <label class="form-label">

                OTP

            </label>

            <input type="text" maxlength="6" id="OTP" class="form-control" placeholder="000000" required>

        </div>

        <button type="submit" class="btn btn-primary w-100">

            <i class="fa-solid fa-circle-check"></i>

            Verify OTP

        </button>

    </form>

    <div class="text-center mt-4">

        <a href="/forgot-password-page">

            <i class="fa-solid fa-arrow-left"></i>

            Back

        </a>

    </div>

</div>

<script src="{{ url_for('static', filename='js/verify_otp.js') }}"></script>

</body>

</html>
