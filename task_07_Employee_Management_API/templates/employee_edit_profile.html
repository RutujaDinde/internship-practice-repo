{% extends "base_1.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="page-header">

    <h2>Edit Profile</h2>

    <p>Update your personal information.</p>

</div>

<div class="edit-profile-card">

    <!-- ================= LEFT PROFILE IMAGE ================= -->

    <div class="edit-left">

        <img id="profile_Image"
            src="/static/uploads/{{ employee.Profile_Image or 'default.png' }}"
            class="big-profile"
            alt="Profile Image">

        <h5 class="mt-3">
            Profile Photo
        </h5>

        <p class="text-muted small mb-3">
            Upload JPG, PNG or JPEG
        </p>

        <input  type="file"  id="Profile_Image"  name="Profile_Image"  class="form-control"  accept="image/*">

    </div>

    <!-- ================= RIGHT FORM ================= -->

    <div class="edit-right">

        <form id="editProfileForm">

            <div class="row">

                <!-- Phone -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"  id="Phone_No" name="Phone_No" class="form-control" placeholder="Enter phone number">

                </div>

                <!-- City -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">City</label>

                    <input type="text"  id="City" name="City" class="form-control" placeholder="Enter city">

                </div>

                <!-- Address -->

                <div class="col-12 mb-4">

                    <label class="form-label"> Address</label>

                    <textarea id="Address" name="Address" rows="5" class="form-control" placeholder="Enter address"></textarea>

                </div>

            </div>

            <div class="d-flex justify-content-end gap-3">

                <button type="button" class="btn btn-outline-secondary" onclick="backProfile()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="fas fa-save me-2"></i>

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

<script src="/static/js/employee_profile.js"></script>

{% endblock %}
