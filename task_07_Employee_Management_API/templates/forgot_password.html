<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(rgba(6,25,60,.65),
            rgba(6,25,60,.65)),
            url("{{ url_for('static', filename='uploads/auth-bg.png') }}");

            background-size:cover;

            background-position:center;

            font-family:'Poppins',sans-serif;

        }

        .forgot-card{

            width:420px;

            background:rgba(255,255,255,.96);

            border-radius:18px;

            padding:40px;

            box-shadow:0 20px 50px rgba(0,0,0,.25);

        }

        .logo{

            width:80px;

            height:80px;

            border-radius:50%;

            background:#0d6efd;

            color:#fff;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            font-size:34px;

            margin-bottom:20px;

        }

        h3{

            text-align:center;

            font-weight:700;

            color:#1b2b52;

        }

        p{

            text-align:center;

            color:#6c757d;

            margin-bottom:30px;

        }

        .form-control{

            height:48px;

            border-radius:10px;

        }

        .btn-primary{

            height:48px;

            border-radius:10px;

            font-weight:600;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="forgot-card">

    <div class="logo">

        <i class="fas fa-lock"></i>

    </div>

    <h3>Forgot Password</h3>

    <p>Enter your registered email to receive a verification OTP.</p>

    <form id="forgotPasswordForm">

        <div class="mb-3">

            <label class="form-label">Email Address</label>

            <input type="email" id="Email" class="form-control" placeholder="Enter your registered email" required>

        </div>

        <button type="submit" class="btn btn-primary w-100">
            
            <i class="fa-solid fa-paper-plane"></i>

            Send OTP

        </button>

    </form>

    <div class="text-center mt-4">

        <a href="/login-page">

            <i class="fas fa-arrow-left"></i>

            Back to Login

        </a>

    </div>

</div>

<script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>

</body>

</html>
